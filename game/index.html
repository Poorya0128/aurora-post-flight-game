<canvas id="game"></canvas>
<!-- Grade overlay: vignette plus dawn haze, styled as #fx-grade in
     style.css. Sits over the canvas, under the HUD, ignores input. -->

     the first rendered frame. -->
<div id="loading" style="z-index:10;letter-spacing:0.12em;font-size:20px;font-family:'AuroraSans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;color:#FFD9A0;background:#2B3A67;justify-content:center;align-items:center;display:flex;inset:0;position:fixed;">
<div class="splash">
<div class="splash-title">AURORA POST</div>
<div class="splash-sub">DAWN MAIL · LOADING THE ARCHIPELAGO</div>
<div class="splash-bar"><span></span></div>
</div>
</div>
<script src="./src/main.js" type="module"></script>
